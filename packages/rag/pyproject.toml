[project]
name = "rag"
version = "0.1.0"
description = "Hybrid retrieval with access control and evidence-based evaluation for Company M's knowledge base"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "httpx>=0.27"]

[project.optional-dependencies]
pdf = ["pdfplumber==0.11.10", "pdfminer.six==20260107"]  # pinned: extracted text feeds the evidence checks and the CI gate
test = ["pytest>=8"]

[tool.setuptools]
packages = ["rag"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
