name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: pip install ./packages/lungnod -r services/cad-service/requirements-dev.txt
      - name: lungnod (P1) unit tests
        run: python -m pytest -q packages/lungnod/tests
      - name: cad-service (P2) tests
        run: python -m pytest -q services/cad-service/tests
      - name: erpqms tests
        run: python -m pytest -q packages/erpqms/tests

  rag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "./packages/rag[pdf,test]"
      - name: Unit tests (synthetic corpus only)
        run: python -m pytest -q packages/rag/tests
      - name: Retrieval gate on the synthetic internal corpus (always runs; no downloads)
        run: |
          python eval/run_retrieval.py --corpus internal --out /tmp/m1-internal
          python eval/check_gate.py --baseline results/m1/internal --candidate /tmp/m1-internal
      # FDA's website rejects some data-centre networks, GitHub-hosted runners included. When the
      # download fails, the full-corpus checks are skipped with a warning instead of failing the build;
      # run `make eval-m1` locally and commit results/m1/ to refresh the full baseline.
      - name: Fetch public corpus (FDA guidance and 510(k) PDFs)
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_public_corpus.py
      - name: Full-corpus quote checks and retrieval gate
        if: steps.fetch.outcome == 'success'
        run: |
          python -m pytest -q packages/rag/tests -k pdf_evidence
          python eval/run_retrieval.py --out /tmp/m1
          python eval/check_gate.py --baseline results/m1 --candidate /tmp/m1
      - name: Report skipped full-corpus checks
        if: steps.fetch.outcome != 'success'
        run: echo "::warning title=Full-corpus retrieval checks skipped::Public PDFs could not be downloaded from FDA on this runner; only the synthetic-corpus gate ran."

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ./packages/rag -e "./packages/tools[test]"
      - name: Tools, guard, approvals, agent loop, MCP stdio
        run: python -m pytest -q packages/tools/tests
      - name: Injection suite (worst-case model; fails on any unflagged draft with the guard on)
        run: python eval/injection/run_injection.py --out /tmp/m2 --fail-on-created
      - name: Text-to-SQL gold queries and result comparison
        run: python eval/text2sql/run_text2sql.py --model gold --fail-below 1.0
      - name: Text-to-SQL v2 gold queries
        run: python eval/text2sql/run_text2sql.py --model gold --bank v2 --fail-below 1.0
      - name: Routing evaluation (no model calls)
        run: python eval/routing/run_routing.py --out /tmp/m3
      - name: Demo UI backend (no Chainlit needed)
        run: python -m pytest -q apps/assistant-ui/tests

  assistant-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r services/assistant-api/requirements.txt ./packages/rag -e "./packages/tools[test]"
      - name: API tests
        run: python -m pytest -q services/assistant-api/tests
      - name: Build two image versions
        run: |
          for v in 0.1.0 0.2.0; do
            docker build -f services/assistant-api/deploy/Dockerfile --build-arg APP_VERSION=$v -t assistant-api:$v .
          done
      - uses: helm/kind-action@v1
        with: {cluster_name: m3}
      - name: Deploy, update and roll back on kind (timed)
        run: OUT=timings.jsonl services/assistant-api/deploy/kind-timing.sh
      - name: Timings to the job summary
        if: always()
        run: |
          echo '### assistant-api on kind' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat timings.jsonl >> "$GITHUB_STEP_SUMMARY" || true; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: kind-timings, path: timings.jsonl}

  erpqms-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: erpqms}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install "psycopg[binary]>=3.1"
      - name: Same answers on SQLite and PostgreSQL
        env: {PGPASSWORD: postgres}
        run: python packages/erpqms/scripts/check_postgres.py --dsn "host=localhost user=postgres password=postgres dbname=erpqms"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f services/cad-service/deploy/Dockerfile -t nodule-service:${{ github.sha }} .
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Smoke test (container starts, loads a model, reports ready)
        run: |
          pip install numpy onnx pydicom pytest
          mkdir -p models
          python -c "import sys; sys.path.insert(0, 'services/cad-service/tests'); from conftest import tiny_onnx; tiny_onnx('models/nodule_cnn.onnx')"
          docker run -d --name svc -p 8000:8000 -v "$PWD/models:/app/models:ro" \
            -e MODEL_PATH=/app/models/nodule_cnn.onnx -e GBM_PATH= nodule-service:${{ github.sha }}
          for i in $(seq 30); do curl -fsS localhost:8000/readyz && exit 0; sleep 2; done
          docker logs svc; exit 1
